name: 功能建议
description: 建议新功能或改进现有体验
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 Lyra Code 提出建议。提交前请先搜索现有 Issue，看看是否已有相同讨论。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 请说明你在什么场景遇到了什么问题，而不仅是描述想要的功能。
      placeholder: 当我……时，目前……，因此……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 请描述期望的交互、行为或结果。
      placeholder: 我希望 Lyra Code 能够……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果考虑过其他实现方式或临时解决办法，请在这里说明。

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可添加示意图、参考链接或其他有助于理解建议的内容。请勿包含敏感信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true
        - label: 该建议描述了明确的使用场景、问题和期望结果。
          required: true
